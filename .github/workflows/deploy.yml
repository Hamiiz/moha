name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY:     ghcr.io
  IMAGE_OWNER:  ${{ github.repository_owner }}
  # Optional: Turborepo Remote Cache (set in repo secrets if using Vercel Remote Cache)
  TURBO_TOKEN:  ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM:   ${{ secrets.TURBO_TEAM }}

# ──────────────────────────────────────────────────────────────────────────
# Job 1 – Lint & Type Check
# Runs pnpm turbo lint and check-types across all workspaces.
# Turborepo caches results by source hash — re-runs only changed packages.
# ──────────────────────────────────────────────────────────────────────────
jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm turbo run lint

      - name: Type check
        run: pnpm turbo run check-types

  # ──────────────────────────────────────────────────────────────────────
  # Job 2 – Build Verification
  # Verifies a production build succeeds across all apps and packages.
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build all workspaces
        run: pnpm turbo run build

  # ──────────────────────────────────────────────────────────────────────
  # Job 3 – Containerize & Deploy
  # Builds Docker images for api and web, pushes to GHCR, then deploys
  # apps/api to Fly.io using flyctl.
  # ──────────────────────────────────────────────────────────────────────
  containerize-deploy:
    name: Containerize & Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Multi-platform builds (linux/amd64 + linux/arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── API image ───────────────────────────────────────────────────
      - name: Extract metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/moha-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context:    .
          file:       ./Dockerfile
          push:       true
          platforms:  linux/amd64,linux/arm64
          tags:       ${{ steps.meta-api.outputs.tags }}
          labels:     ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Web image ───────────────────────────────────────────────────
      - name: Extract metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/moha-web
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context:    .
          file:       ./apps/web/Dockerfile
          push:       true
          platforms:  linux/amd64,linux/arm64
          tags:       ${{ steps.meta-web.outputs.tags }}
          labels:     ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Deploy API to Fly.io ────────────────────────────────────────
      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API to Fly.io
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
