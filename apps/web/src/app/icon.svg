<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded Background -->
  <rect width="64" height="64" rx="14" fill="#0F172A" />

  <!-- Outer Steering Wheel Rim -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#F8FAFC" stroke-width="4.5" />

  <!-- Stylized M / Steering Wheel Spokes -->
  <!-- Left Spoke & Pillar -->
  <path d="M14 36 L24 22 L32 34 L40 22 L50 36" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Center Hub / Horn -->
  <circle cx="32" cy="35" r="5" fill="#F59E0B" />

  <!-- Lower Vertical Spoke -->
  <line x1="32" y1="40" x2="32" y2="56" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />
</svg>
